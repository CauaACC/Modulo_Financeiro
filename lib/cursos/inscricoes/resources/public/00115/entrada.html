<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b9a6e">
    <title>Pro-REDE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 40px 30px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 100%;
            max-width: 380px;
            height: auto;
            margin-bottom: 20px;
        }
        .subtitulo {
            font-size: clamp(11px, 3.2vw, 14px);
            color: #555;
            font-weight: 300;
            line-height: 1.4;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 13px 20px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            background: #fff;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn:hover {
            background: #f9f9f9;
            border-color: #ccc;
        }
        .btn:active {
            background: #f0f0f0;
        }
        .btn .descricao {
            display: block;
            font-size: 11px;
            color: #999;
            font-weight: 400;
            margin-top: 2px;
        }
        .secao-titulo {
            font-size: 11px;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px;
        }
        .rodape {
            font-size: 11px;
            color: #ccc;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="prorede-logo.png" alt="Pro-Rede" class="logo">
        <p class="subtitulo">Programa de Resposta Estrat&eacute;gica<br>&agrave; neuroDiversidade na Educa&ccedil;&atilde;o</p>

        <p class="secao-titulo">Acesso</p>

        <a id="btnInscricao" class="btn" href="#">
            Inscrito
            <span class="descricao">Acompanhar inscricao e documentos</span>
        </a>
        <a id="btnPes" class="btn" href="#">
            PES
            <span class="descricao">Profissional Especializado de Suporte</span>
        </a>
        <a id="btnSupervisor" class="btn" href="#">
            Supervisor
            <span class="descricao">Acompanhamento de equipe</span>
        </a>
        <a id="btnAdmin" class="btn" href="#">
            Administrador
            <span class="descricao">Gestao do sistema</span>
        </a>

        <p class="rodape">HUTEC</p>
    </div>

    <script>
        var base = 'https://opctec.net.br/hutec/prorede-032-2025-inscricao/inscricoes/index.php';
        var urlLoginInscrito = base + '?content=view/inscricao/inscricao_01.php';
        var urlLoginAdmin = base + '?content=view/admin/login.php';

        document.getElementById('btnInscricao').href = urlLoginInscrito;
        document.getElementById('btnPes').href = urlLoginInscrito;
        document.getElementById('btnSupervisor').href = urlLoginAdmin;
        document.getElementById('btnAdmin').href = urlLoginAdmin;
    </script>
</body>
</html>
